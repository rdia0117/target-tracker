<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目標價追蹤</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
  --head: #f0f2f5; --hover: #f3f6fb; --accent: #2f5bd3;
  --up: #d1343a; --down: #1a8a4a; --flag-bg: #fff4d6; --flag-text: #8a5a00; --stale: #9aa0a8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1b1f26; --text: #e5e7eb; --muted: #9aa3b0; --line: #2c323c;
    --head: #222831; --hover: #232a34; --accent: #7aa2ff;
    --up: #ff6b70; --down: #3fcf7f; --flag-bg: #3a2f12; --flag-text: #f5c96a; --stale: #6b7380;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1500px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px;
  max-width: 1500px; margin: 0 auto; }
select, input[type=search] { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
select { min-width: 220px; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
.count { color: var(--muted); margin-left: auto; font-size: 13px; }
.wrap { max-width: 1500px; margin: 0 auto 32px; padding: 0 16px; }
.scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--head); font-weight: 600; font-size: 13px; z-index: 1; }
/* 股票欄固定在左邊，左右滑動看數字時名稱不會滑走；背景要實色才蓋得住底下滑過的欄位 */
tbody td { background: var(--panel); }
th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; box-shadow: inset -1px 0 0 var(--line); }
th:first-child { z-index: 3; }
.grp { max-width: 170px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; color: var(--muted); }
.chg .toggle { display: none; color: var(--accent); cursor: pointer; }
@media (max-width: 768px) {
  /* 股票欄收窄：代號獨立一行，名稱下方的類別字截得更短 */
  th, td { padding-left: 6px; padding-right: 6px; }
  td.name { padding-left: 8px; }
  .name .sym { display: block; margin: 0; font-size: 11px; line-height: 1.3; }
  .grp { max-width: 84px; font-size: 11px; }
  .name .badge { display: none; }  /* 整列已標黃，手機省下這個寬度 */
  .chg .more { display: none; }
  .chg.open .more { display: block; }
  .chg .toggle { display: inline; }
  .chg.open .toggle { display: none; }
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th .arrow { display: inline-block; color: var(--accent); }  /* 沒排序的欄不預留箭頭空間 */
th .sub { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
td.l, th.l { text-align: left; }
tbody tr:hover td { background: var(--hover); }
tr.changed td { background: var(--flag-bg); }
.name a { color: var(--text); text-decoration: none; font-weight: 600; }
.name a:hover { color: var(--accent); }
.sym { color: var(--muted); font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }
/* 一週內目標價有調整：放在代號旁，股票欄固定在左邊所以手機一打開就看得到 */
.recent { font-size: 11px; font-weight: 700; margin-left: 4px; }
.recent.up { color: var(--up); } .recent.down { color: var(--down); }
.small { font-size: 12px; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px;
  background: var(--flag-bg); color: var(--flag-text); border: 1px solid currentColor; margin-left: 4px; }
.stale { color: var(--stale); }
.chg { font-size: 12px; line-height: 1.6; text-align: left; }
.chg .d { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.empty { color: var(--stale); }
footer { max-width: 1500px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>目標價追蹤</h1>
  <div class="meta" id="meta"></div>
</header>
<div class="controls">
  <select id="group" aria-label="類別"></select>
  <input type="search" id="q" placeholder="搜尋代號或名稱" aria-label="搜尋">
  <label class="chk"><input type="checkbox" id="onlyChanged"> 只看今日目標價變動</label>
  <span class="count" id="count"></span>
</div>
<div class="wrap"><div class="scroll"><table>
  <thead><tr id="thead"></tr></thead>
  <tbody id="tbody"></tbody>
</table></div></div>
<footer>
  目標價為 FactSet 分析師共識均值（來源：鉅亨網）；「最近三次變動」的日期為 FactSet 共識更新日，由本系統每日比對快照偵測，
  「首次紀錄」表示系統開始追蹤時的基準值。價差 = (目標價 − 收盤價) ÷ 收盤價。月營收來源證交所／櫃買中心月營收彙總表（未公布前以 FinMind 補），EPS 來源 FinMind，為單季。
  本益比 = 收盤價 ÷ 近四季 EPS，近四季虧損者顯示「—」。
  目標價更新日超過 180 天以灰字顯示。股票代號旁的 ▲／▼ 表示 7 天內目標價調升／調降及距今天數。
</footer>

const META = DATA.meta, ROWS = DATA.rows;
const ALL = "__all__";

const COLS = [
  { key: "recent", label: "股票", cls: "l", sortable: true },  // 依代號旁 ▲▼ 標籤排序
  { key: "close", label: "收盤價", sortable: true },
  { key: "target", label: "目標價", sub: "均值・高・低", sortable: true },
  { key: "upside", label: "目標價差", sub: "%", sortable: true },
  { key: "rev_yoy", label: "營收 YoY", sub: "%", sortable: true },
  { key: "rev_mom", label: "營收 MoM", sub: "%", sortable: true },
  { key: "eps", label: "EPS", sub: "最新單季", sortable: true },
  { key: "eps_ttm", label: "EPS", sub: "近四季", sortable: true },
  { key: "pe", label: "本益比", sub: "倍", sortable: true },
  { key: "last_change", label: "最近三次目標價變動", cls: "l", sortable: true },
];

const state = loadState();

function loadState() {
  const d = { group: ALL, sortKey: "upside", sortDir: -1, q: "", onlyChanged: false };
  try {
    const saved = Object.assign(d, JSON.parse(localStorage.getItem("tt_state") || "{}"));
    if (!COLS.some(c => c.sortable && c.key === saved.sortKey)) { saved.sortKey = "upside"; saved.sortDir = -1; }  // 舊版存的欄位已不存在
    return saved;
  } catch (e) { return d; }
}
function saveState() {
  try { localStorage.setItem("tt_state", JSON.stringify(state)); } catch (e) {}
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 2) => v == null ? "" : Number(v).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPrice = v => v == null ? "" : fmt(v, v >= 1000 ? 0 : (Number.isInteger(v) ? 0 : 2));
const signCls = v => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
const pct = v => v == null ? '<span class="empty">—</span>' : `<span class="num ${signCls(v)}">${v > 0 ? "+" : ""}${fmt(v, 1)}%</span>`;

function sortValue(r, key) {
  if (key === "last_change") return r.changes.length ? r.changes[0].rate_date : null;
  if (key === "recent") {
    // 越近越前面；同一天調升排在調降前面。沒有標籤的回傳 null（永遠排最後）
    const rc = r.recent_change;
    return rc ? rc.days * 2 + (rc.dir === "up" ? 0 : 1) : null;
  }
  return r[key];
}

function categoryLabel(r) {
  // 選了某個類別時，名稱下方再寫一次同樣的類別沒有意義，只在「全部」時顯示
  return state.group === ALL ? r.groups.join("、") : "";
}

function recentBadge(r) {
  const rc = r.recent_change;
  if (!rc) return "";
  const arrow = rc.dir === "up" ? "▲" : "▼";
  const when = rc.days === 0 ? "今日" : `${rc.days}天`;
  const verb = rc.dir === "up" ? "調升" : "調降";
  return `<b class="recent ${rc.dir}" title="${rc.days === 0 ? "今日" : rc.days + " 天前"}目標價${verb}">${arrow}${when}</b>`;
}

function changesCell(r) {
  if (!r.changes.length) return '<span class="empty">無券商覆蓋</span>';
  // 手機上只顯示最近一筆，其餘 .more 點一下才展開
  const lines = r.changes.map((c, i) => {
    const cls = i > 0 ? ' class="more"' : "";
    if (c.kind === "initial") return `<div${cls}><span class="d">${esc(c.rate_date)}</span>${fmtPrice(c.new)} <span class="small">首次紀錄</span></div>`;
    const p = c.old ? (c.new / c.old - 1) * 100 : null;
    const arrow = c.new > c.old ? "▲" : "▼";
    return `<div${cls}><span class="d">${esc(c.rate_date)}</span>${fmtPrice(c.old)} → ${fmtPrice(c.new)} <span class="${signCls(p)}">${arrow}${fmt(Math.abs(p), 1)}%</span></div>`;
  });
  if (lines.length > 1) lines[0] = lines[0].replace(/<\/div>$/, ` <span class="toggle">+${lines.length - 1} 筆</span></div>`);
  return lines.join("");
}

function targetRange(r) {
  // 只有一家券商（最高=最低=均值）時不重複顯示
  if (r.target_high == null || r.target_low == null || r.target_high === r.target_low) return "";
  return `<div class="small">高 ${fmtPrice(r.target_high)}</div><div class="small">低 ${fmtPrice(r.target_low)}</div>`;
}

function renderHead() {
  document.getElementById("thead").innerHTML = COLS.map(c => {
    const arrow = c.sortable && state.sortKey === c.key ? (state.sortDir > 0 ? "▲" : "▼") : "";
    return `<th class="${c.cls || ""} ${c.sortable ? "sortable" : ""}" data-key="${c.key}">
      ${c.label}<span class="arrow">${arrow}</span>${c.sub ? `<span class="sub">${c.sub}</span>` : ""}</th>`;
  }).join("");
  document.querySelectorAll("th.sortable").forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    if (state.sortKey === k) state.sortDir *= -1;
    else { state.sortKey = k; state.sortDir = k === "recent" ? 1 : -1; }
    render();
  });
}

function render() {
  saveState();
  renderHead();
  const q = state.q.trim().toLowerCase();
  let rows = ROWS.filter(r =>
    (state.group === ALL || r.groups.includes(state.group)) &&
    (!state.onlyChanged || r.changed_today) &&
    (!q || r.symbol.includes(q) || r.name.toLowerCase().includes(q)));

  const k = state.sortKey, dir = state.sortDir;
  rows.sort((a, b) => {
    const va = sortValue(a, k), vb = sortValue(b, k);
    if (va == null && vb == null) return a.symbol < b.symbol ? -1 : 1;
    if (va == null) return 1;          // 空值永遠排最後
    if (vb == null) return -1;
    if (va === vb) return a.symbol < b.symbol ? -1 : 1;  // 同值時依代號，順序才固定
    return (va < vb ? -1 : 1) * dir;
  });

  document.getElementById("tbody").innerHTML = rows.map(r => {
    const tgtCls = r.target_stale ? "stale" : "";
    const tgtTitle = r.target == null ? "" : `中位數 ${fmtPrice(r.target_median)}｜最高 ${fmtPrice(r.target_high)}｜最低 ${fmtPrice(r.target_low)}｜更新 ${r.rate_date}`;
    return `<tr class="${r.changed_today ? "changed" : ""}">
      <td class="l name"><span class="sym">${esc(r.symbol)}${recentBadge(r)}</span><a href="https://www.cnyes.com/twstock/${encodeURIComponent(r.symbol)}" target="_blank" rel="noopener">${esc(r.name)}</a>${r.changed_today ? '<span class="badge">今日調整</span>' : ""}
        ${categoryLabel(r) ? `<div class="grp" title="${esc(categoryLabel(r))}">${esc(categoryLabel(r))}</div>` : ""}</td>
      <td class="num">${r.close == null ? '<span class="empty">—</span>' : fmtPrice(r.close)}</td>
      <td class="num ${tgtCls}" title="${esc(tgtTitle)}">${r.target == null ? '<span class="empty">—</span>' : fmtPrice(r.target)}
        ${r.target == null ? "" : targetRange(r)}
        ${r.target == null ? "" : `<div class="small">${r.num_est ?? "?"} 家${r.target_stale ? "・資料較舊" : ""}</div>`}</td>
      <td>${pct(r.upside)}</td>
      <td>${pct(r.rev_yoy)}</td>
      <td>${pct(r.rev_mom)}${r.rev_period ? `<div class="small">${esc(r.rev_period)}</div>` : ""}</td>
      <td class="num ${signCls(r.eps)}">${r.eps == null ? '<span class="empty">—</span>' : fmt(r.eps)}${r.eps_quarter ? `<div class="small">${esc(r.eps_quarter)}${r.eps_last_year != null ? `・去年 ${fmt(r.eps_last_year)}` : ""}</div>` : ""}</td>
      <td class="num ${signCls(r.eps_ttm)}">${r.eps_ttm == null ? '<span class="empty">—</span>' : fmt(r.eps_ttm)}</td>
      <td class="num">${r.pe == null ? '<span class="empty">—</span>' : fmt(r.pe, 1)}</td>
      <td class="chg">${changesCell(r)}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="${COLS.length}" class="l empty">沒有符合條件的股票</td></tr>`;

  document.getElementById("count").textContent = `${rows.length} 檔`;
}

function init() {
  const changed = ROWS.filter(r => r.changed_today).length;
  document.getElementById("meta").innerHTML =
    `收盤價日期 ${esc(META.price_date || "—")}・更新於 ${esc(META.generated_at.replace("T", " "))}・` +
    `今日目標價變動 <b>${changed}</b> 檔` +
    (META.failed.length ? `・<span class="up">抓取失敗 ${META.failed.length} 檔</span>` : "");

  const sel = document.getElementById("group");
  const cnt = g => ROWS.filter(r => r.groups.includes(g)).length;
  sel.innerHTML = `<option value="${ALL}">全部類別（${ROWS.length}）</option>` +
    META.groups.map(g => `<option value="${esc(g)}">${esc(g)}（${cnt(g)}）</option>`).join("");
  if (state.group !== ALL && !META.groups.includes(state.group)) state.group = ALL;
  sel.value = state.group;
  sel.onchange = () => { state.group = sel.value; render(); };

  const q = document.getElementById("q");
  q.value = state.q;
  q.oninput = () => { state.q = q.value; render(); };

  const oc = document.getElementById("onlyChanged");
  oc.checked = state.onlyChanged;
  oc.onchange = () => { state.onlyChanged = oc.checked; render(); };

  document.getElementById("tbody").addEventListener("click", e => {
    const cell = e.target.closest("td.chg");
    if (cell && cell.querySelector(".more")) cell.classList.toggle("open");
  });

  render();
}
init();
</script>
</body>
</html>
